name: Blogger Automation Workflow

on:
  schedule:
    # প্রতি ৩ ঘণ্টা পর পর অটো রান হবে (UTC টাইম অনুযায়ী)
    - cron: '0 */3 * * *'
  workflow_dispatch: # গিটহাব থেকে ম্যানুয়ালি টেস্ট করার জন্য

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    # state.json ফাইলে নতুন ইনডেক্স সেভ করার পারমিশন
    permissions:
      contents: write

    steps:
    - name: Check out Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Main Script
      env:
        BLOG_ID: ${{ secrets.BLOG_ID }}
        BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
        BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      run: python main.py

    - name: Commit and push updated category state
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add state.json
        # যদি ফাইলে পরিবর্তন হয়, তবেই গিটহাবে পুশ করবে
        git diff --staged --quiet || git commit -m "Update category sequence in state.json [skip ci]"
        git push
        
