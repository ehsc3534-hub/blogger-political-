name: Blogger Automation Workflow

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *' # প্রতি ৩ ঘণ্টা পরপর স্বয়ংক্রিয়ভাবে রান হবে

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai google-auth-oauthlib google-api-python-client

    - name: Execute Main Script
      env:
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
        BLOG_ID: ${{ secrets.BLOG_ID }}
        BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
        BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      run: |
        python main.py
        
